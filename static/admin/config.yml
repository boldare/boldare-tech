backend:
  name: git-gateway
  # Was xsolve-pl/boldare-tech, the pre-rename org. git-gateway ignores this
  # field (the Netlify Identity token decides the repo), but a stale value is
  # misleading to anyone reading the config.
  repo: boldare/boldare-tech
  branch: master
  # Keep reading and writing the pre-Decap editorial-workflow labels. Decap 3
  # defaults to 'decap-cms/', and its built-in migration skips existing PRs --
  # it looks them up in the legacy refs/meta/_netlify_cms store, which no
  # longer holds their keys. There are no open workflow entries today (see
  # tests/BASELINE.md), so nothing is at risk right now, but anything an editor
  # starts before this ships would otherwise vanish from the Workflow tab.
  cms_label_prefix: 'netlify-cms/'

media_folder: static/img
public_folder: /img

publish_mode: editorial_workflow

slug:
  encoding: "ascii"
  clean_accents: true

collections:
  - name: "parts"
    label: "Parts"
    delete: false
    folder: "content/parts"
    fields:
      - {label: "Title", name: "title", widget: "string", pattern: ['.{5,}', "Must have at least 5 characters"]}
      - {label: "Content", name: "body", widget: "markdown", required: false}

  - name: "blog"
    label: "Blog Articles"
    label_singular: "Blog Article"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}_{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string", pattern: ['.{5,}', "Must have at least 5 characters"]}
      - {label: "Sub title", name: "subTitle", widget: "string", required: false, pattern: ['.{5,}', "Must have at least 5 characters"]}
      - {label: "Content", name: "body", widget: "markdown", required: false}
      - {label: "Cover", name: "cover", widget: "image"}
      - {label: "Article Tags", name: "tags", widget: "list"}
      - {label: "Post Authors", name: "postAuthor", widget: "string"}



  # content/pages/*.md become real pages via gatsby-node.js and are linked from
  # the top menu, but had no collection -- they could only be changed by editing
  # git directly. `create` is off: adding a page also means adding it to the
  # menu, which is a code change.
  - name: "pages"
    label: "Pages"
    label_singular: "Page"
    delete: false
    create: false
    folder: "content/pages"
    fields:
      - {label: "Title", name: "title", widget: "string", pattern: ['.{5,}', "Must have at least 5 characters"]}
      - {label: "Menu title", name: "menuTitle", widget: "string", required: false}
      - {label: "Content", name: "body", widget: "markdown", required: false}
